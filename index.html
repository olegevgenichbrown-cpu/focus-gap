<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FocusGap | BULLETPROOF v2.4</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; padding: 20px; text-align: center; }
        .card { background: #111; padding: 30px; border-radius: 20px; border: 1px solid #333; }
        .btn { background: #ffcc00; color: #000; padding: 20px; border: none; border-radius: 50px; width: 100%; font-weight: bold; font-size: 1.2rem; margin: 20px 0; }
        #log { background: #222; color: #0f0; padding: 15px; border-radius: 10px; font-size: 10px; text-align: left; min-height: 200px; white-space: pre-wrap; overflow-y: auto; }
    </style>
</head>
<body>
    <div class="card">
        <h1 style="font-size: 1rem; opacity: 0.5;">DEBUG MODE v2.4 (YELLOW)</h1>
        <div id="co2" style="font-size: 5rem; font-weight: bold; margin: 20px;">--</div>
        
        <button class="btn" onclick="runTest()">CONNECT SENSOR</button>
        
        <div id="log">Console ready...</div>
    </div>

    <script>
        const logBox = document.getElementById('log');
        const co2Box = document.getElementById('co2');

        function print(msg) {
            logBox.innerText += '\n[' + new Date().toLocaleTimeString() + '] ' + msg;
            logBox.scrollTop = logBox.scrollHeight;
        }

        async function runTest() {
            print(">>> Button clicked!");
            
            if (!navigator.bluetooth) {
                print("Error: navigator.bluetooth missing");
                return;
            }

            try {
                print("Requesting device...");
                const dev = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: ['0000ff01-0000-1000-8000-00805f9b34fb']
                });

                print("Device selected: " + dev.name);
                const server = await dev.gatt.connect();
                print("GATT Connected");

                const service = await server.getPrimaryService('0000ff01-0000-1000-8000-00805f9b34fb');
                const char = await service.getCharacteristic('0000ff02-0000-1000-8000-00805f9b34fb');
                
                await char.startNotifications();
                print("Notifications on!");

                char.addEventListener('characteristicvaluechanged', (e) => {
                    const val = e.target.value.getUint32(0, true);
                    co2Box.innerText = val;
                });

            } catch (err) {
                print("FAIL: " + err.name + " -> " + err.message);
            }
        }

        window.onload = () => { print("Page loaded. Ready for test."); };
    </script>
</body>
</html>
