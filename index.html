<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FocusGap Intelligence | Debug v2.2</title>
    <style>
        :root {
            --bg: #050505; --fg: #ffffff; --accent: #10b981; --chart: #f59e0b;
            --card-bg: rgba(255, 255, 255, 0.045); --border: rgba(255, 255, 255, 0.08);
            --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font); }
        body { background: var(--bg); color: var(--fg); min-height: 100vh; padding: 1.5rem; }
        .container { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem; }
        .main-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 2.5rem; padding: 3rem 1.5rem; text-align: center; }
        .co2-val { font-size: 7rem; font-weight: 700; line-height: 1; letter-spacing: -0.05em; margin: 1rem 0; }
        .pill-btn { background: #3b82f6; color: #fff; border: none; padding: 1.2rem; border-radius: 3rem; font-weight: 800; text-transform: uppercase; cursor: pointer; width: 100%; transition: 0.3s; }
        .pill-btn:active { transform: scale(0.95); opacity: 0.8; }
        #debug-log { background: rgba(0,0,0,0.5); border: 1px solid #333; border-radius: 1rem; padding: 1rem; font-family: monospace; font-size: 0.7rem; color: #aaa; min-height: 100px; overflow-y: auto; white-space: pre-wrap; }
        .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: #555; margin-right: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <header style="display:flex; justify-content:space-between; align-items:center">
            <span style="font-size:0.6rem; letter-spacing:0.2em; opacity:0.5">FOCUSGAP CLOUD v2.2</span>
            <div id="status-tag" style="font-size:0.6rem; font-weight:800; color:#555"><span class="dot" id="s-dot"></span>OFFLINE</div>
        </header>

        <section class="main-card">
            <div style="font-size:0.7rem; opacity:0.3; letter-spacing:0.2em">CURRENT CO2</div>
            <div class="co2-val" id="co2-val">--</div>
            <div id="score" style="color:var(--accent); font-size:0.6rem; font-weight:800; text-transform:uppercase">Ready to Scan</div>
        </section>

        <button class="pill-btn" onclick="connectBT()" id="main-btn">Connect Local Sensor</button>

        <div id="debug-log">System initialized. Waiting for user interaction...</div>
    </div>

    <script>
        const logEl = document.getElementById('debug-log');
        const co2El = document.getElementById('co2-val');
        const btnEl = document.getElementById('main-btn');
        const dotEl = document.getElementById('s-dot');

        function log(msg) {
            console.log(msg);
            logEl.innerText += '\n> ' + msg;
            logEl.scrollTop = logEl.scrollHeight;
        }

        async function connectBT() {
            log("Attempting Bluetooth request...");
            
            if (!navigator.bluetooth) {
                log("CRITICAL ERROR: navigator.bluetooth is UNDEFINED.");
                log("Reason: This browser or context (HTTP) does not support Web Bluetooth.");
                alert("This browser is NOT compatible with Bluetooth. Use Bluefy or WebBLE.");
                return;
            }

            try {
                log("Opening system Picker...");
                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'FocusGap Intelligence' }],
                    optionalServices: [0xFF01]
                });

                log("Device selected: " + device.name);
                dotEl.style.background = "#f59e0b"; // Orange = Connecting
                
                device.addEventListener('gattserverdisconnected', () => {
                    log("Server disconnected.");
                    dotEl.style.background = "#555";
                    btnEl.innerText = "Reconnect Sensor";
                });

                log("Connecting to GATT server...");
                const server = await device.gatt.connect();
                
                log("GATT Connected. Fetching Service...");
                const service = await server.getPrimaryService(0xFF01);
                
                log("Service 0xFF01 found. Getting CO2 Char...");
                const co2Char = await service.getCharacteristic(0xFF02);
                
                log("Starting notifications...");
                await co2Char.startNotifications();
                
                co2Char.addEventListener('characteristicvaluechanged', (event) => {
                    const value = event.target.value.getUint32(0, true);
                    co2El.innerText = value;
                    const score = Math.max(0, Math.round(100 - (Math.pow(Math.max(0, value - 400), 1.2) / 38)));
                    document.getElementById('score').innerText = 'BRAIN OPTIMA: ' + score + '%';
                });

                log("SUCCESS! Receiving data.");
                dotEl.style.background = "#3b82f6"; // Blue = Active
                btnEl.innerText = "Linked via BLE";
                btnEl.style.background = "#10b981";

            } catch (error) {
                log("ERROR: " + error.message);
                dotEl.style.background = "#ef4444";
                if (error.name === 'NotFoundError') {
                    log("Advice: Make sure your ESP32-C3 is powered on and flashing BLE.");
                }
            }
        }

        // Feature detection on load
        window.onload = () => {
            if (!navigator.bluetooth) {
                log("Warning: navigator.bluetooth not supported here.");
                btnEl.style.background = "#333";
                btnEl.innerText = "Incompatible Browser";
            } else {
                log("Browser supports Web Bluetooth. Ready to go.");
            }
        };
    </script>
</body>
</html>
